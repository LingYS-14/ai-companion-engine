name: 功能请求
description: 提出一个新功能或对现有行为的改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。提交前请先搜索[已有 issue](https://github.com/LingYS-14/ai-companion-engine/issues)，确认这个想法还没有被提出过。

  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 这个需求是为了解决什么问题？请描述具体的使用场景和当前的痛点。
      placeholder: 我在……时遇到……，希望……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望这个功能如何工作？如涉及界面、配置或使用方式，可以一并说明。
      placeholder: 我期望可以……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代做法或临时变通方式？为什么它们不能满足需求？
      placeholder: 我也考虑过……，但……
    validations:
      required: false
